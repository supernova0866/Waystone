<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WayStone — Accept Invite</title>

<script>
(function () {
  var theme = 'default';
  try { theme = localStorage.getItem('waystone-preview-theme') || 'default'; } catch (e) {}
  document.write('<link rel="stylesheet" href="/style/' + theme + '.css" id="theme-css" />');
})();
</script>
<link rel="stylesheet" href="/style/base.css" />

<style>
  .invite-shell { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .invite-brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 6px; }
  .invite-brand-mark { color: var(--accent); }
  .invite-brand-mark svg { width: 34px; height: 38px; display: block; }
  .invite-title { font-size: 19px; font-weight: 700; color: var(--text-strong); letter-spacing: 0.02em; }
  .invite-code-input { text-transform: uppercase; letter-spacing: 0.2em; text-align: center; font-family: var(--font-mono); }
  .invite-error { font-size: 12.5px; color: var(--danger); text-align: center; min-height: 16px; margin: -4px 0 0; }
  .invite-success { font-size: 13px; color: var(--success); text-align: center; }
  .invite-footer { display: flex; justify-content: center; margin-top: 4px; }
  .invite-footer a { font-size: 12.5px; color: var(--text-muted); text-decoration: none; }
  .invite-footer a:hover { color: var(--accent); }
</style>
</head>
<body>

<div class="centered">
  <div class="panel panel-narrow invite-shell">
    <div class="invite-brand">
      <span class="invite-brand-mark">
        <svg viewBox="0 0 20 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 1 L18 7 L18 23 L2 23 L2 7 Z" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M6.5 13.5 L13.5 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
      <div class="invite-title">WayStone</div>
    </div>

    <form id="code-form" style="width:100%;display:flex;flex-direction:column;gap:14px">
      <div class="field" style="margin-bottom:0">
        <label class="field-label" for="invite-code">Invite code</label>
        <input class="input invite-code-input" id="invite-code" maxlength="32" autocomplete="off" autofocus />
      </div>
      <div class="invite-error" id="code-error"></div>
      <button class="btn btn-primary btn-block" type="submit" id="code-submit">Continue</button>
    </form>

    <form id="account-form" style="display:none;width:100%;flex-direction:column;gap:14px">
      <div class="field" style="margin-bottom:0">
        <label class="field-label" for="new-username">Username</label>
        <input class="input" id="new-username" autocomplete="username" />
      </div>
      <div class="field" style="margin-bottom:0">
        <label class="field-label" for="new-password">Master password</label>
        <input class="input" type="password" id="new-password" autocomplete="new-password" />
      </div>
      <div class="hint">At least 8 characters. There's no password reset — losing this means losing everything encrypted with it.</div>
      <div class="invite-error" id="account-error"></div>
      <button class="btn btn-primary btn-block" type="submit" id="account-submit">Create account</button>
    </form>

    <div id="success-block" style="display:none;text-align:center">
      <div class="invite-success">Account created — you can log in now.</div>
      <a class="btn btn-primary btn-block" href="/" style="margin-top:14px;text-decoration:none">Go to login</a>
    </div>

    <div class="invite-footer">
      <a href="/pages/handbook.html">How WayStone works</a>
    </div>
  </div>
</div>

<script type="module">
import { checkInviteCode, acceptInvite } from '/core/client/api.js';
import { initParticles } from '/core/client/particles.js';

initParticles();

let validatedCode = null;

const codeForm = document.getElementById('code-form');
const codeInput = document.getElementById('invite-code');
const codeError = document.getElementById('code-error');
const codeSubmit = document.getElementById('code-submit');

const accountForm = document.getElementById('account-form');
const usernameInput = document.getElementById('new-username');
const passwordInput = document.getElementById('new-password');
const accountError = document.getElementById('account-error');
const accountSubmit = document.getElementById('account-submit');

const successBlock = document.getElementById('success-block');

codeInput.addEventListener('input', () => {
  codeInput.value = codeInput.value.toUpperCase();
});

codeForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = codeInput.value.trim();
  if (!code) return;

  codeError.textContent = '';
  codeSubmit.disabled = true;
  codeSubmit.textContent = 'Checking…';

  try {
    await checkInviteCode(code);
    validatedCode = code;
    codeForm.style.display = 'none';
    accountForm.style.display = 'flex';
    usernameInput.focus();
  } catch (err) {
    codeError.textContent = err.status === 410 ? 'That code has already been used.' : 'Invalid invite code.';
  } finally {
    codeSubmit.disabled = false;
    codeSubmit.textContent = 'Continue';
  }
});

accountForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = usernameInput.value.trim();
  const password = passwordInput.value;
  if (!username || !password) return;

  accountError.textContent = '';
  accountSubmit.disabled = true;
  accountSubmit.textContent = 'Creating…';

  try {
    await acceptInvite(validatedCode, username, password);
    accountForm.style.display = 'none';
    successBlock.style.display = 'block';
  } catch (err) {
    accountError.textContent = err.message || 'Something went wrong.';
    accountSubmit.disabled = false;
    accountSubmit.textContent = 'Create account';
  }
});
</script>

</body>
</html>
